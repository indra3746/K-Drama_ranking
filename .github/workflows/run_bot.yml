name: Run K-Drama Ranking Bot

on:
  schedule:
    # 한국 시간 매일 오전 8시 45분 실행
    # (UTC 기준 전날 23시 45분 -> 서버가 한산해서 아주 좋습니다 👍)
    - cron: '45 23 * * *'
  
  # 수동 실행 기능
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # [경고 해결] v3 -> v4 로 업데이트

      - name: Set up Python
        uses: actions/setup-python@v5  # [경고 해결] v4 -> v5 로 업데이트
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
