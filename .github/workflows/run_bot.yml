name: Run K-Drama Ranking Bot

on:
  schedule:
    # 한국 시간 매일 오전 8시 45분 실행
    # (UTC 기준 전날 23시 45분 -> 서버가 한산해서 아주 좋습니다 👍)
    - cron: '45 23 * * *'
  
  # 수동 실행 기능
  workflow_dispatch:

# [추가됨] keepalive-workflow가 60일 방지용 더미 커밋을 남길 수 있도록 쓰기 권한 부여
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # [수정됨] v3 -> v4 로 올려서 Node.js 경고 해결

      - name: Set up Python
        uses: actions/setup-python@v5  # [수정됨] v4 -> v5 로 올려서 Node.js 경고 해결
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      # [추가됨] 60일 비활성화 방지용 코드
      # 깃허브가 활동이 없다고 판단하기 전에 알아서 빈 기록을 남겨 봇을 살려둡니다.
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
